<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e6" />
    <title>advoc.me — o link na bio, para advogados</title>
    <meta
      name="description"
      content="A página de perfil única e compartilhável para advogados. Dentro das normas da OAB."
    />

    <!-- Identidade da aba e da tela de início — a marca de verdade, não mais uma
         balança desenhada em SVG parecida com o ícone da interface.
         São PNG porque a marca é uma imagem com degradê: um SVG dela seria o
         mesmo PNG embutido em base64, com o peso e sem a nitidez. Duas medidas
         porque a aba pede 32 e o atalho do Android pede 192 — deixar o navegador
         reduzir o de 512 para 32 borra os dois pratos de baixo.
         O apple-touch-icon é o que o iOS usa ao salvar na tela de início; sem
         ele o iPhone recorta um retrato da página, que sai ilegível.
         Todos gerados/versionados — ver scripts/gen-brand-assets.mjs. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Prévia de link da HOME. As páginas de perfil recebem as suas próprias,
         montadas por perfil na borda (netlify/edge-functions/perfil.ts) — estas
         valem para a home e para qualquer rota que não seja um perfil. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="advoc.me" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="advoc.me — o link na bio, para advogados" />
    <meta
      property="og:description"
      content="A página de perfil única e compartilhável para advogados. Dentro das normas da OAB."
    />
    <meta property="og:image" content="/og-padrao.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Uma família de display por tema (ver src/lib/themes.ts): trocar de tema
         muda a VOZ do perfil, não só a cor. É um pedido de CSS só; o navegador
         baixa apenas os arquivos da fonte que o tema em uso realmente aplica. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Cormorant+Garamond:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Hanken+Grotesk:wght@400;500;600;700&family=Lora:wght@400..700&family=Newsreader:opsz,wght@6..72,400..700&family=Playfair+Display:ital,wght@0,400..800;1,400..600&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
