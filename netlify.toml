# Deploy do frontend (Vite/React) no Netlify.
# Variáveis de ambiente ficam em Site settings → Environment variables:
#   VITE_API_URL       = https://<seu-backend>.onrender.com   (backend no Render)
#   VITE_USE_REAL_API  = true   (opcional; sem isso, perfis ficam no localStorage
#                                e só a geração de bio usa o backend)

[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# A API é servida no MESMO endereço do site. Isto não é conforto: é a única
# forma de o login funcionar no iPhone.
#
# Enquanto o site era `advocme.netlify.app` e a API `...nip.io`, os dois eram
# SITES DIFERENTES para o navegador — e o cookie da sessão, um cookie "de
# terceiros". O Safari (iOS e macOS) descarta esses cookies por padrão desde
# 2020. O efeito observado: `POST /auth/login` respondia 201, o servidor mandava
# o cookie, e a requisição SEGUINTE já chegava sem ele. A pessoa entrava, o site
# não percebia, ela tentava de novo. Seis vezes seguidas, no caso real que
# motivou isto (iPhone, iOS 18.7, 25/08/2026).
#
# Com este proxy o navegador só conversa com advocme.netlify.app: o cookie passa
# a ser de primeira parte e vale em todo navegador. O Netlify repassa a chamada
# ao backend por trás, com cabeçalhos e cookies.
#
# ⚠️ TEM de vir ANTES do catch-all abaixo: o Netlify aplica a PRIMEIRA regra que
# casa, e `/*` casaria com `/api/...` primeiro, devolvendo o index.html no lugar
# da resposta da API.
[[redirects]]
  from = "/api/*"
  to = "https://advocme.74.208.118.111.nip.io/api/:splat"
  status = 200
  force = true

# React Router: qualquer rota cai no index.html (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Funções de borda (Deno) — ver netlify/edge-functions/.
#
# Rodam ANTES dos redirecionamentos acima, o que é justamente o que a prévia do
# link precisa: `perfil` chama `ctx.next()`, recebe o index.html que a regra do
# SPA produziu, e injeta as meta tags do advogado antes de entregar. O robô do
# WhatsApp não executa JavaScript — sem esta etapa, todo perfil compartilhado
# aparece com o título genérico da plataforma. Ver src/lib/ogTags.ts.
#
# `perfil` roda em TODA página HTML, e faz duas coisas: nas de perfil injeta as
# tags do advogado; em qualquer uma transforma o og:image relativo do index.html
# em absoluto (o LinkedIn descarta o relativo). Quem decide se um caminho é
# perfil é `ehSlugDePerfil()`, que recusa as rotas do app e tudo que tem ponto no
# nome — e a lista de rotas reservadas tem teste que a compara com o App.tsx.
[[edge_functions]]
  path = "/*"
  # A API e os arquivos com hash no nome não passam por aqui: a função só faz
  # sentido sobre HTML, e deixá-la no caminho de toda chamada de API somaria
  # uma etapa a cada requisição do app para não fazer nada.
  excludedPath = ["/api/*", "/assets/*"]
  function = "perfil"

[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/robots.txt"
  function = "robots"

# Cabeçalhos de segurança da PÁGINA. A API tem os seus próprios
# (backend/src/security/headers.ts); estes valem para o que o navegador executa.
#
# O CSP é a segunda barreira contra XSS: mesmo que um texto malicioso escape do
# saneamento do backend, um <script> injetado não roda (script-src 'self') e não
# há para onde mandar o que ele roubasse (connect-src restrito).
#
# Sobre as escolhas:
#   • style-src 'unsafe-inline' — o framer-motion anima escrevendo no atributo
#     style dos elementos; sem isso, as animações do perfil param.
#   • fonts.googleapis/gstatic — as famílias por tema (ver index.html).
#   • img-src data: — a foto de perfil é embutida como data URI.
#   • frame-src com os DOIS provedores de vídeo, e mais ninguém.
#
#     Estava `frame-src 'none'`, e isso quebrava o vídeo de apresentação — o
#     recurso mais caro do plano Max — em produção, sem deixar rastro na tela:
#     quem clicasse em "Assistir" via uma caixa vazia, e o motivo só aparecia no
#     console do navegador. Comprovado no perfil de um cliente real:
#       Framing 'https://www.youtube-nocookie.com/' violates the following
#       Content Security Policy directive: "frame-src 'none'".
#
#     Ninguém notou porque o defeito exige três coisas ao mesmo tempo: um perfil
#     Max, com vídeo preenchido, e alguém clicando para assistir.
#
#     A lista é fechada nos hosts que o código realmente monta (ver lib/video.ts):
#     continua não havendo como emoldurar um site qualquer.
#   • media-src 'self' — o vídeo do perfil de demonstração é servido por nós
#     mesmos (arquivo em public/), e não por um provedor.
#   • connect-src https: — a API fica num host definido por variável de ambiente
#     (VITE_API_URL). Ao fixar o domínio do backend, troque `https:` pela origem
#     exata (ex.: https://api.advoc.me) e o vazamento por fetch fica fechado.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

# Os arquivos com hash no nome podem ser guardados para sempre; o index.html, não
# (senão o navegador serve uma versão antiga do app depois de um deploy).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
